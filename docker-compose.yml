# 旅途计划 · 单机 Docker 部署（对齐 sesame-rise，无不配 HTTPS）
# 默认：本机已有 Postgres + 本仓库 api + gateway
# 外层 Nginx 只需端口转发到 PORT

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-crpi-jya41iij3cykq66t.cn-chengdu.personal.cr.aliyuncs.com/jiangker_love/debian:stable-20240904-slim-shanghai}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.aliyun.com}
    image: travel-api:latest
    container_name: travel-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-travel-dev-secret-change-me}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
      PORT: "3000"
      DEV_MODE: ${DEV_MODE:-0}
      RUST_LOG: ${RUST_LOG:-server=info,sqlx=warn,tower_http=info}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 唯一对外入口（仅 HTTP）；路径分流 /api /health /admin
  gateway:
    image: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    container_name: travel-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # 后续管理端（同域 /admin）
  # admin:
  #   image: travel-admin:latest
  #   restart: unless-stopped
  #   expose:
  #     - "80"
