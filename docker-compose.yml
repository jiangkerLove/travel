# 统一基础镜像
x-base-image: &base-image
  BASE_IMAGE: ${BASE_IMAGE:-crpi-jya41iij3cykq66t.cn-chengdu.personal.cr.aliyuncs.com/jiangker_love/debian:stable-20240904-slim-shanghai}

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        <<: *base-image
    image: travel-api:latest
    container_name: travel-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-travel-dev-secret-change-me}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      AMAP_KEY: ${AMAP_KEY:-}
      AMAP_SECRET: ${AMAP_SECRET:-}
      # 仅容器内网监听，不对外映射
      PORT: "3000"
      DEV_MODE: ${DEV_MODE:-0}
      RUST_LOG: ${RUST_LOG:-server=info,sqlx=warn,tower_http=info}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 25s
      retries: 5

  # 唯一对外入口：基于同一 debian 镜像安装 nginx，做路径分流
  gateway:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
      args:
        <<: *base-image
    image: travel-gateway:latest
    container_name: travel-gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"

  # 后续管理端（同域 /admin）：仅容器内网，不单独对外开端口
