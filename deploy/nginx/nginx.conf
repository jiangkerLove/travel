worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    # Docker 内置 DNS，便于后续 admin 容器动态解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 同域路径分流（外层 Nginx 只端口转发到本容器即可）
    #   /api/*   → api:3000
    #   /health  → api:3000
    #   /admin/* → admin:80（未部署时返回 503）

    upstream travel_api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://travel_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://travel_api/health;
            proxy_set_header Host $host;
        }

        # 管理端上线后：确保 compose 中有 admin 服务，并保持此段
        location /admin/ {
            set $admin_upstream http://admin:80;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 301 /admin/;
        }

        location / {
            default_type text/plain;
            return 200 'travel ok\n';
        }
    }
}
