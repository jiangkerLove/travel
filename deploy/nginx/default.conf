# 挂到官方/镜像 nginx 的 conf.d（仅 HTTP；HTTPS 由外层 Nginx 处理）
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;

    # Docker 内置 DNS（管理端容器可后启）
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    location = /health {
        proxy_pass http://api:3000/health;
        proxy_set_header Host $host;
    }

    # 管理端上线后：compose 增加 admin 服务即可
    location /admin/ {
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        default_type text/plain;
        return 200 'travel ok\n';
    }
}
